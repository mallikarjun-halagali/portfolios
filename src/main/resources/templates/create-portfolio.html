<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Create Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 40px;
        }
        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 24px;
            border-radius: 8px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>➕ Create New Portfolio</h2>

    <form method="post" action="/portfolio/create">
        <label>Portfolio Name</label>
        <input type="text" name="name" required/>

        <label>User ID</label>
        <input type="text" name="userId" required/>

        <label>Initial Investment</label>
        <input type="number" step="0.01" name="investedValue" required/>

        <button type="submit">Create Portfolio</button>
    </form>
</div>
</body>
</html>
